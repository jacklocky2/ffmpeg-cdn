<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ffmpeg-cdn · 浏览器压缩示例</title>
<style>
  body { font: 14px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 820px; margin: 40px auto; padding: 0 20px; color: #1f2328; }
  button { padding: 8px 18px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #log { margin-top: 16px; height: 260px; overflow: auto; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
  #bar { height: 8px; background: #d0d7de; border-radius: 4px; overflow: hidden; margin-top: 10px; }
  #bar > i { display: block; height: 100%; width: 0; background: #1f883d; transition: width .2s; }
</style>
</head>
<body>
<h1>浏览器端视频压缩</h1>
<p>需通过 http(s) 访问（ES module + Worker 不支持 file://）。选一个视频文件，转码为 H.264 MP4。</p>

<p><input type="file" id="file" accept="video/*"></p>
<p><button id="run" disabled>开始压缩</button></p>
<div id="bar"><i></i></div>
<div id="log"></div>

<script type="module">
import { FFmpeg, fetchFile } from "./api/index.js";

const $ = (s) => document.querySelector(s);
const logEl = $("#log"), barEl = $("#bar > i"), btn = $("#run"), fileInput = $("#file");
const log = (m) => { logEl.textContent += m + "\n"; logEl.scrollTop = logEl.scrollHeight; };

let ffmpeg, loading;
async function ensureLoaded() {
  if (ffmpeg) return ffmpeg;
  if (!loading) {
    loading = (async () => {
      const f = new FFmpeg();
      f.on("log", ({ message }) => log(message));
      f.on("progress", ({ progress }) => { barEl.style.width = Math.max(0, Math.min(1, progress)) * 100 + "%"; });
      log("loading core (32MB, 首次较慢)…");
      await f.load();
      log("core loaded.");
      return f;
    })();
  }
  return (ffmpeg = await loading);
}

fileInput.addEventListener("change", () => { btn.disabled = !fileInput.files.length; });

btn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) return;
  btn.disabled = true;
  barEl.style.width = "0";
  try {
    const f = await ensureLoaded();
    log(`input: ${file.name} (${(file.size / 1048576).toFixed(1)} MB)`);

    await f.writeFile("input", await fetchFile(file));
    log("writeFile done, exec…");

    await f.exec([
      "-i", "input",
      "-c:v", "libx264", "-crf", "30", "-preset", "veryfast",
      "-vf", "scale=trunc(iw/2)*2:trunc(ih/2)*2",
      "-c:a", "aac", "-b:a", "96k",
      "output.mp4",
    ]);
    log("exec done, reading…");

    const data = await f.readFile("output.mp4");
    const url = URL.createObjectURL(new Blob([data.buffer], { type: "video/mp4" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = file.name.replace(/\.[^.]+$/, "") + "-compressed.mp4";
    a.textContent = `下载压缩后文件（${(data.length / 1048576).toFixed(1)} MB）`;
    logEl.after(a);
    log(`done: ${(data.length / 1048576).toFixed(1)} MB (原 ${(file.size / 1048576).toFixed(1)} MB)`);

    await f.deleteFile("input");
    await f.deleteFile("output.mp4");
  } catch (e) {
    log("ERROR: " + e);
  } finally {
    btn.disabled = !fileInput.files.length;
  }
});
</script>
</body>
</html>
